name: smoke (windows weekly)

# The shipping platform. Weekly so Windows minutes aren't burned per push;
# catches interpreter-discovery / ffmpeg-path drift on the real target (audit Bug B).
on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (choco)
        run: choco install ffmpeg -y
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Smoke test (headless render + ffprobe gate)
        shell: cmd
        run: python scripts/smoke_test.py
